<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">Illustration of a foldable phone, folded and unfolded</title>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#fff" stroke-opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="#222"/>
  <rect width="1200" height="675" fill="url(#grid)"/>

  <!-- unfolded: one wide screen with the crease down the middle -->
  <g transform="translate(250 120)">
    <rect width="440" height="440" rx="34" fill="#111" stroke="#F7F7F7" stroke-opacity=".7" stroke-width="2"/>
    <rect x="16" y="16" width="408" height="408" rx="22" fill="url(#screen)"/>
    <rect x="16" y="16" width="408" height="408" rx="22" fill="url(#sheen)"/>
    <line x1="220" y1="16" x2="220" y2="424" stroke="#fff" stroke-opacity=".18" stroke-width="2" stroke-dasharray="2 6"/>
    <rect x="196" y="28" width="48" height="10" rx="5" fill="#000"/>
    <!-- two app panes, to show the tablet-sized screen -->
    <rect x="40" y="70" width="160" height="110" rx="10" fill="#fff" fill-opacity=".06"/>
    <rect x="40" y="196" width="160" height="12" rx="6" fill="#fff" fill-opacity=".12"/>
    <rect x="40" y="218" width="120" height="12" rx="6" fill="#fff" fill-opacity=".08"/>
    <rect x="240" y="70" width="160" height="320" rx="10" fill="#fff" fill-opacity=".05"/>
  </g>

  <!-- folded: half the width, closed on its hinge -->
  <g transform="translate(760 140)">
    <rect x="10" y="8" width="200" height="400" rx="30" fill="#000" opacity=".5"/>
    <rect width="200" height="400" rx="30" fill="#111" stroke="#F7F7F7" stroke-opacity=".7" stroke-width="2"/>
    <rect x="12" y="12" width="176" height="376" rx="20" fill="url(#screen)"/>
    <rect x="80" y="24" width="40" height="9" rx="4.5" fill="#000"/>
    <rect x="-6" y="40" width="8" height="320" rx="4" fill="#FF3B30"/>
  </g>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" fill="#F7F7F7">
    <text x="250" y="610" font-size="15" letter-spacing="3" fill-opacity=".55">UNFOLDED</text>
    <text x="760" y="610" font-size="15" letter-spacing="3" fill-opacity=".55">FOLDED</text>
    <circle cx="757" cy="580" r="5" fill="#FF3B30"/>
    <text x="772" y="585" font-size="13" letter-spacing="2" fill-opacity=".55">HINGE</text>
    <text x="40" y="56" font-size="16" letter-spacing="4">IPHONE DUO</text>
    <text x="40" y="82" font-size="13" letter-spacing="3" fill-opacity=".5">ILLUSTRATION · NOT TO SCALE</text>
  </g>
</svg>
