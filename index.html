<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alan Aziz — come back soon</title>
<meta name="description" content="The site is being worked on. Back shortly.">
<meta name="robots" content="noindex">

<meta property="og:title" content="Alan Aziz — come back soon">
<meta property="og:description" content="The site is being worked on. Back shortly.">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">

<style>
:root{
  --paper:#E4E4E1;
  --sweep:#CFD0CB;
  --white:#F7F7F5;
  --ink:#16181B;
  --ink-soft:#55585C;
  --accent:#2438E0;
  --display:'Archivo',system-ui,sans-serif;
  --body:'Newsreader',Georgia,serif;
}

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  background:var(--paper);
  background-image:radial-gradient(120% 70% at 50% -10%, var(--white) 0%, var(--paper) 45%, var(--sweep) 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--body);
  font-size:1.0625rem;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
}

:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:2px}

.wrap{max-width:1120px;margin:0 auto;padding:0 24px;width:100%}

main{
  flex:1;
  display:flex;
  align-items:center;
  padding:64px 0 88px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:9px;
  font-family:var(--display);
  font-size:.8125rem;
  font-weight:500;
  letter-spacing:.02em;
  color:var(--ink-soft);
  margin:0 0 30px;
}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  flex:none;
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:1;transform:scale(1)}
  50%{opacity:.35;transform:scale(.82)}
}

h1{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(2.75rem,9vw,6rem);
  line-height:.95;
  letter-spacing:-.035em;
  margin:0;
  max-width:14ch;
}

footer{
  padding:22px 0 30px;
  font-family:var(--display);
  font-size:.8125rem;
  color:var(--ink-soft);
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<main>
  <div class="wrap">
    <p class="status"><span class="dot"></span>WORKING ON THE SITE</p>
    <h1>Come back soon.</h1>
  </div>
</main>

<footer>
  <div class="wrap">© 2026 Alan Aziz</div>
</footer>

</body>
</html>
